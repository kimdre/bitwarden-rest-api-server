name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # https://github.com/bitwarden/clients/releases?q=CLI
  BW_CLI_VERSION: 2026.6.0

jobs:
  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build image
        run: |
          docker build \
            --build-arg BW_CLI_VERSION=${BW_CLI_VERSION} \
            -t bitwarden-rest-api-smoke:${{ github.sha }} \
            src/

      - name: Smoke test bw --version
        run: |
          version="$(docker run --rm --entrypoint /usr/local/bin/bw bitwarden-rest-api-smoke:${{ github.sha }} --version)"
          echo "Detected bw version: ${version}"
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'

  build:
    name: Build image
    needs: docker-smoke
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            bitwarden-cli.version=${{ env.BW_CLI_VERSION }}
          tags: |
            type=raw,value=${{ env.BW_CLI_VERSION }}
            type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: src
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          build-args: |
            BW_CLI_VERSION=${{ env.BW_CLI_VERSION  }}
          cache-from: type=gha
          cache-to: type=gha,mode=max