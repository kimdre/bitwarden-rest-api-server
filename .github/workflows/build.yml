name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # https://github.com/bitwarden/clients/releases?q=CLI
  BW_CLI_VERSION: 2026.5.0

jobs:
  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build image
        run: |
          docker build \
            --build-arg BW_CLI_VERSION=${BW_CLI_VERSION} \
            -t bitwarden-rest-api-smoke:${{ github.sha }} \
            src/

      - name: Smoke test bw --version
        run: |
          version="$(docker run --rm --entrypoint /usr/local/bin/bw bitwarden-rest-api-smoke:${{ github.sha }} --version)"
          echo "Detected bw version: ${version}"
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'

  build:
    name: Build image
    needs: docker-smoke
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            bitwarden-cli.version=${{ env.BW_CLI_VERSION }}
          tags: |
            type=raw,value=${{ env.BW_CLI_VERSION }}
            type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: src
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          build-args: |
            BW_CLI_VERSION=${{ env.BW_CLI_VERSION  }}
          cache-from: type=gha
          cache-to: type=gha,mode=max